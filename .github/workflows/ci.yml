name: CI PREVNAR

on:
  pull_request:
  push:
    branches:
      - master
      - "feat/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r etl/requirements.txt
      - name: Run methodology tests
        run: python -m pytest tests -q
      - name: Run Release Guardian
        run: python etl/release_guardian.py --mode ci

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate regulatory benchmark
        run: python etl/regulatory_compliance.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Lint
        run: npm run lint --prefix web
      - name: Build
        run: npm run build --prefix web
